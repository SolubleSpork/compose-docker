[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compose-docker"
dynamic = ["version"]
description = "Interactive CLI that generates a docker-compose.yml matching personal deployment standards"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "questionary>=2.0",
    "ruamel.yaml>=0.18",
]

[project.scripts]
composedocker = "compose_docker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
